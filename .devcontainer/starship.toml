"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_status\
$c\
$cmake\
$rust\
$python\
$golang\
$nodejs\
$dotnet\
$java\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold blue"

[os.symbols]
Fedora = ""

[directory]
style = "bold cyan"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[c]
symbol = " "
style = "bold blue"
format = "via [$symbol($version(-$name) )]($style)"
detect_extensions = ["c", "h", "cpp", "hpp", "cc", "cxx"]

[cmake]
symbol = " "
style = "bold blue"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[dotnet]
symbol = " "
style = "bold purple"
format = "via [$symbol($version )]($style)"

[java]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"