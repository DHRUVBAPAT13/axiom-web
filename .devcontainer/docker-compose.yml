services:
    workspace:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ..:/workspaces/${localWorkspaceFolderBasename}:cached
        command: sleep infinity
        depends_on:
            - ollama

    ollama:
        image: ollama/ollama:latest
        container_name: devcontainer-ollama
        volumes:
            - ollama_models:/root/.ollama
        ports:
            - "11434:11434"
        environment:
            - OLLAMA_KEEP_ALIVE=24h
        restart: unless-stopped
        # Uncomment the 'deploy' block below if your host has an NVIDIA GPU + NVIDIA Container Toolkit:
        # deploy:
        #   resources:
        #     reservations:
        #       devices:
        #         - driver: nvidia
        #           count: all
        #           capabilities: [gpu]

volumes:
    ollama_models:
